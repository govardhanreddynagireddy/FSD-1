<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal and External JavaScript</title>
    <script src="script.js"></script>
    <script>
        function internalMessage(){
            alert("This is an internal JavaScript message.");
        }
    </script>
</head>
<body>
    <h2>JavaScript Examples</h2>
    <button onclick="internalMessage()">Show JavaScript Internal Message</button>
    <br><br>
    <button onclick="externalMessage()">Show JavaScript External Message</button>
</body>
</html>
