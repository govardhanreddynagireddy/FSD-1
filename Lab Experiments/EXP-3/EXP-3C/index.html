<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of Css </title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2{
            color:rgb(16, 246, 246);
            background-color: rgb(242, 242, 230);
            text-align: center;
        }
        p{
            color:blue;
            font-size: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h2> This is Internal Css Example</h2>
    <p>This is a paragraph with internal CSS styling.</p>
    
       <h3 style="color: red; text-align: center">   This heading uses Inline CSS.</h3>
   
    <h1>This is External Css Example</h1>
</body>
</html>
